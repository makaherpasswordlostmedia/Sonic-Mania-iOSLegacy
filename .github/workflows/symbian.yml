  host-test:
    name: Freestanding compile + link (host)
    needs: sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: .
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-multilib g++-multilib
      - name: 32-bit freestanding syntax check (gnu++11 and gnu++17)
        run: |
          chmod +x symbian/tools/*.sh
          CXXSTD=gnu++11 symbian/tools/fcheck.sh
          CXXSTD=gnu++17 symbian/tools/fcheck.sh
      - name: No-libc link of engine + game + rt.cpp, boot smoke test
        run: symbian/tools/hostlink.sh /tmp/smhost

  build-sis:
    name: Build sonicmania.sisx
    needs: sources
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: src

      - name: Check out symbian3-toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_REPO }}
          ref: ${{ env.TOOLCHAIN_REF }}
          path: toolchain

      - name: Create case-sensitive APFS volume
        run: |
          hdiutil create -size 24g -fs "Case-sensitive APFS" -volname Symbian -type SPARSE "$RUNNER_TEMP/symbian"
          hdiutil attach "$RUNNER_TEMP/symbian.sparseimage" -mountpoint "$SYMBIAN_VOL"
          sudo chown "$(id -u):$(id -g)" "$SYMBIAN_VOL"

      - name: Install Homebrew dependencies and Rosetta
        run: |
          brew install perl openssl@3 unshield make gmp mpfr libmpc isl gnu-sed
          brew unlink perl
          sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Restore toolchain cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: symbian3-toolchain-${{ env.TOOLCHAIN_REF }}-${{ env.GNUPOC_COMMIT }}-${{ env.GCC4SYMBIAN_COMMIT }}

      - name: Build toolchain and install SDK (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JOBS: 4
        run: |
          set -eo pipefail
          cd toolchain
          source Scripts/env.sh
          mkdir -p "$N8_SRC"
          git clone https://github.com/mstorsjo/gnupoc-package "$N8_SRC/gnupoc-package"
          git -C "$N8_SRC/gnupoc-package" checkout "$GNUPOC_COMMIT"
          git clone https://github.com/fedor4ever/GCC4Symbian "$N8_SRC/GCC4Symbian"
          git -C "$N8_SRC/GCC4Symbian" checkout "$GCC4SYMBIAN_COMMIT"
          Scripts/fetch-sdk.sh
          Scripts/build-host-tools.sh
          Scripts/build-gcc.sh
          Scripts/install-sdk.sh

      - name: Save toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Generate .mmp and build
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          ROOT="${EPOCROOT:-/Volumes/Symbian/sdks/symbian3/}"
          has() { find "$ROOT/epoc32" -ipath "$1" 2>/dev/null | grep -q .; }
          GLES=0
          if has '*/GLES2/gl2.h' && has '*/EGL/egl.h' && has '*/libglesv2.*' && has '*/libegl.*'; then GLES=1; fi
          echo "GLES 2 in SDK: $GLES"
          GCCV=$(arm-none-symbianelf-gcc -dumpversion 2>/dev/null || echo 4)
          echo "cross gcc: $GCCV"
          STD="-std=gnu++17"
          [ "${GCCV%%.*}" -lt 11 ] && STD="-std=gnu++14"
          [ "${GCCV%%.*}" -lt 6 ] && STD="-std=gnu++11"
          AB=1; [ "${{ inputs.plus }}" = "true" ] && AB=0
          cd src/symbian
          chmod +x tools/*.sh
          tools/gen_mmp.sh "$AB" "$STD" "$GLES"
          cd group
          bldmake bldfiles
          abld build -keepgoing gcce urel 2>&1 | tee "$GITHUB_WORKSPACE/build.log" || true
          echo "=========== compile errors ==========="
          grep -E "error:|fatal error|undefined reference|multiple definition|\*\*\* \[|cannot find" "$GITHUB_WORKSPACE/build.log" \
            | sed 's|/Users/runner/work/[^/]*/[^/]*/||g' | sort -u | head -80 || true
          test -f "${EPOCROOT:-/Volumes/Symbian/sdks/symbian3/}epoc32/release/gcce/urel/sonicmania.exe" || { echo "sonicmania.exe was not built"; exit 1; }

      - name: Package signed SIS
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"
          "$N8_REPO/Scripts/package-sis.sh" src/symbian/sis/sonicmania.pkg "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: sonicmania-symbian3
          path: dist/sonicmania.sisx
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
