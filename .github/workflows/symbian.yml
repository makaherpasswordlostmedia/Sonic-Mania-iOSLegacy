name: Build Symbian^3 SIS (Sonic Mania)

# SELF-CONTAINED: drop only this file into .github/workflows/ of the Sonic-Mania-iOSLegacy (PSP) repo. The 'sources' job
# unpacks the whole Symbian layer (symbian/) and applies the engine patch (port.patch) on top of the repo checkout.
#
# sources   : unpack + patch
# host-test : PC checks - 32-bit freestanding compile of everything against symbian/shim/libc only, plus a no-libc link
#             of engine + game + rt.cpp (symbian/hostcheck)
# build-sis : Symbian^3 toolchain (fieldops-dev/symbian3-toolchain, macOS runner). First run builds GCC (~2 h, cached).
# Distributable binaries are built with RSDK_AUTOBUILD=1 (Plus content off, RSDKv5 licence). Run the workflow manually
# with "plus = true" for a personal build that plays Sonic Mania Plus from your own Data.rsdk.

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      plus:
        description: 'Personal build with Plus enabled (RSDK_AUTOBUILD=0). Do not redistribute.'
        type: boolean
        default: false

env:
  TOOLCHAIN_REPO: fieldops-dev/symbian3-toolchain
  TOOLCHAIN_REF: a96f917e6c8f02fe4f7c2186f8df760d3d9d832a
  SYMBIAN_VOL: /Volumes/Symbian
  GNUPOC_COMMIT: d3ddaf58c734ad3ab34dc60a012f9d4768a9ed3e
  GCC4SYMBIAN_COMMIT: fe1b15a1c25716d5c515f12593080d58f14d4c3f

