      - name: Patch engine for iOS
        run: python3 tools/apply_ios_port.py
      - name: Theos + toolchain
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" -o /tmp/tc.tar.xz
          tar -xf /tmp/tc.tar.xz -C "$THEOS/toolchain"
      - name: iPhoneOS 9.3 SDK
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o /tmp/sdk.tbz2 "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/sdk.tbz2 -C "$THEOS/sdks"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          ls "$SDK/usr/include/c++" 2>/dev/null || echo "note: SDK has no usr/include/c++ (toolchain libc++ will be used)"
          # the LLVM-19 toolchain ships libc++ headers without __config_site -> create it
          CS="$THEOS/toolchain/linux/iphone/include/c++/v1/__config_site"
          if [ -d "$(dirname "$CS")" ] && [ ! -f "$CS" ]; then
            printf '%s\n' '#ifndef _LIBCPP_CONFIG_SITE' '#define _LIBCPP_CONFIG_SITE' \
              '#define _LIBCPP_ABI_VERSION 1' '#define _LIBCPP_ABI_NAMESPACE __1' \
              '#define _LIBCPP_HAS_THREAD_API_PTHREAD' '#define _LIBCPP_HAS_NO_VENDOR_AVAILABILITY_ANNOTATIONS' \
              '#define _LIBCPP_HARDENING_MODE_DEFAULT _LIBCPP_HARDENING_MODE_NONE' '#define _LIBCPP_PSTL_BACKEND_SERIAL' '#define _LIBCPP_PSTL_CPU_BACKEND_SERIAL' \
              '#endif' > "$CS"
          fi
      - name: Build
        run: |
          set -o pipefail
          make -f Makefile.ios package FINALPACKAGE=1 V=1 2>&1 | tee build.log
      - name: Pack .ipa
        run: |
          set -euo pipefail
          # the staged bundle (.theos/_/Applications) has Info.plist + signed binary; .theos/obj/... holds only the raw binary
          APP="$(find .theos/_ -type d -name SonicMania.app | head -n1)"
          [ -f "$APP/Info.plist" ] || cp Info.plist "$APP/Info.plist"   # safety net if the Makefile hook did not run
          [ -f "$APP/Info.plist" ] || { echo "::error::staged SonicMania.app with Info.plist not found"; find .theos -maxdepth 6 | head -50; exit 1; }
          [ -n "$APP" ] || { echo "::error::SonicMania.app not found"; exit 1; }
          mkdir -p ipa/Payload packages && cp -a "$APP" ipa/Payload/
          (cd ipa && zip -rq ../packages/SonicMania-armv7-ios7.ipa Payload)
      - name: Check Mach-O is armv7
        run: |
          BIN="$(find .theos/_ -type f -name SonicMania | head -n1)"; file "$BIN"
          file "$BIN" | grep -qi "armv7" || { echo "::error::not an armv7 binary"; exit 1; }
      - name: Inspect package (signature, plist, layout)
        run: |
          APP="$(find .theos/_ -type d -name SonicMania.app | head -n1)"
          ls -la "$APP"; cat "$APP/Info.plist" | head -40
          BIN="$APP/SonicMania"; file "$BIN"
          which ldid && ldid -e "$BIN" | head -5 || echo "no ldid on runner"
          unzip -l packages/SonicMania-armv7-ios7.ipa | head -20; ls -la packages
      - uses: actions/upload-artifact@v4
        with: { name: SonicMania-armv7-ios7, path: "packages/*", if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-log, path: build.log, if-no-files-found: ignore }
