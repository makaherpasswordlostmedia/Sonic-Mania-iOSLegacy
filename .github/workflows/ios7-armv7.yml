name: Build Sonic Mania (iOS 7, armv7)
# SINGLE FILE: save as .github/workflows/ios7-armv7.yml (note the dot in .github), commit,
# then Actions -> "Build Sonic Mania (iOS 7, armv7)" -> Run workflow. NO game data inside.
# The port sources are packed in the base64 block below; do not edit it.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y build-essential perl curl ca-certificates zip unzip xz-utils bzip2 git fakeroot make python3
